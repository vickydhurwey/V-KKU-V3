<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>V!KKU V3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background-grid"></div>


<!-- BOOT SCREEN -->

<div id="boot-screen">

    <h1 class="logo">V!KKU V3</h1>

    <p id="status">Initializing System...</p>

    <div class="progress-box">
        <div id="progress"></div>
    </div>

    <p id="percent">0%</p>

</div>



<!-- MAIN DASHBOARD -->

<div id="dashboard">


    <!-- TOP INFORMATION -->

    <div class="top-bar">

        <div>
            <div id="time">00:00:00</div>
            <div id="date">Loading...</div>
        </div>

    </div>



    <!-- AI CORE -->

    <div class="ai-core">

        <div class="orb">

            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>

        </div>


        <h2>V!KKU AI ONLINE</h2>

        <p>Welcome, Vicky</p>


    </div>



    <!-- CHAT AREA -->


    <div class="chat-box">


        <div id="chat">

            <p>
                <b>V!KKU:</b>
                Hello Vicky, I am online.
            </p>

        </div>


        <button id="mic">
            🎤 Talk to V!KKU
        </button>


    </div>



</div>



<script src="script.js"></script>


</body>

</html>
